services:
  - type: web
    name: apostemos
    runtime: node
    buildCommand: "cd server && npm install && cd ../client && npm install && npm run build"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: apostemos-db
          property: connectionString

databases:
  - name: apostemos-db
    plan: free
